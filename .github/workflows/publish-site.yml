name: Publish SMS journal
on:
  push:
    branches: [main]
    paths: ['index.html', 'site/**', 'webapp/public/**', 'webapp/static/**', 'webapp/online_store.py', 'webapp/server.py', 'webapp/report_builder.py', 'webapp/requirements.txt', 'presentations/**', 'tools/build_public_site.py', '.github/workflows/publish-site.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - run: python -m pip install -r webapp/requirements.txt
      - run: python tools/build_public_site.py --output dist/site
      - run: cp index.html .nojekyll dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
