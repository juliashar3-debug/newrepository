name: Check SMS toolkit
on:
  push:
    branches: [main]
    paths: ['.agents/**', 'tools/**', 'webapp/**', '.github/workflows/check-toolkit.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webapp/requirements-all.lock
      - run: python -m pip install -r webapp/requirements-all.lock
      - run: python -m pip check
      - run: python tools/check_tools.py
      - run: python -m unittest discover -s webapp -p "test_*.py" -v
