name: Build SMS report
on:
  push:
    branches: [main]
    paths: ['presentations/report-request.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sms-report-build
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - name: Install report tools
        run: |
          python -m pip install -r webapp/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-dejavu-core
      - name: Build and validate PPTX and PDF
        run: python tools/build_online_report.py
      - name: Save the report pair together
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentations/
          git commit -m 'SMS: publish generated PPTX and PDF'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
